name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RealtimeCourseRegistration.slnx
      - name: Build
        run: dotnet build RealtimeCourseRegistration.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test RealtimeCourseRegistration.slnx --configuration Release --no-build --logger "console;verbosity=minimal"

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_ADMIN_PASSWORD: ci-placeholder-postgres-admin
      IDENTITY_DB_PASSWORD: ci-placeholder-identity
      CAPACITY_DB_PASSWORD: ci-placeholder-capacity
      AUDIT_DB_PASSWORD: ci-placeholder-audit
      RABBITMQ_USER: ci-placeholder-user
      RABBITMQ_PASSWORD: ci-placeholder-rabbit
      JWT_SIGNING_KEY: ci-placeholder-signing-key-0123456789abcdef0123456789abcdef
      JWT_ISSUER: course-registration-ci
      JWT_AUDIENCE: course-web-ci
      AUDIT_INTERNAL_API_KEY: ci-placeholder-audit-key
      DEMO_SEED_ENABLED: "true"
      DEMO_ADMIN_PASSWORD: ci-placeholder-admin-password
      DEMO_STUDENT_PASSWORD: ci-placeholder-student-password
      WEB_PORT: "3000"
      RABBITMQ_MANAGEMENT_PORT: "15672"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build all application images
        run: docker compose build
